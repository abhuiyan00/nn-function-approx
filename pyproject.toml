[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fapprox"
version = "0.1.0"
description = "Neural network as a device for function approximation - own NumPy engine (Soft Computing, Project I, Topic 11, WUST)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]
ui = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Repository = "https://github.com/abhuiyan00/nn-function-approx"

[project.scripts]
fapprox = "fapprox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fapprox_ui = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
